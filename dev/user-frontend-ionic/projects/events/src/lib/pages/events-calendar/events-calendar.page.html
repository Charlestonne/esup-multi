<app-header></app-header>
<ion-content>
  <ion-row class="ion-margin ion-justify-content-center ion-align-items-center" style="height: 100%;">
    <ion-text>
      <h2>{{ 'EVENTS.CALENDAR' | translate }}</h2>
      <p>{{ 'EVENTS.CALENDAR_PLACEHOLDER' | translate }}</p>
    </ion-text>
  </ion-row>
</ion-content>

<!-- Footer with two tabs -->
<ion-footer class="events-footer">
  <ion-toolbar class="events-toolbar">
    <ion-segment [value]="activeTab$ | async" (ionChange)="onSegmentChange($event)" class="events-segment">
      <ion-segment-button value="feed" layout="icon-bottom" class="events-segment-button">
        <ion-icon name="list-outline" size="large"></ion-icon>
        <ion-label>{{ 'EVENTS.FEED' | translate }}</ion-label>
      </ion-segment-button>
      <ion-segment-button value="calendar" layout="icon-bottom" class="events-segment-button">
        <ion-icon name="calendar-outline" size="large"></ion-icon>
        <ion-label>{{ 'EVENTS.CALENDAR' | translate }}</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-footer>
