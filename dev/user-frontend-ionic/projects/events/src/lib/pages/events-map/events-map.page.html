<app-header></app-header>
<ion-content>
  <div *ngIf="eventsWithCoords.length === 0" class="ion-padding ion-text-center">
    <ion-text>{{ 'EVENTS.NO_DATA' | translate }}</ion-text>
  </div>

  <ion-list>
    <ion-item
      *ngFor="let event of eventsWithCoords"
      (click)="navigateToDetail(event.id)"
    >
      <ion-icon slot="start" name="location-outline"></ion-icon>
      <ion-label>
        <h2>{{ event.title }}</h2>
        <p>{{ event.location }}</p>
        <p>{{ event.startDate | date:'dd/MM/yyyy HH:mm' }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
