<app-header></app-header>
<ion-content>
  <ion-progress-bar *ngIf="isLoading" type="indeterminate"></ion-progress-bar>

  <ng-container *ngIf="events$ | async as events">
    <ng-container *ngIf="events.length > 0; else empty">
      <app-event-card
        *ngFor="let event of events"
        [event]="event"
      ></app-event-card>
    </ng-container>
    <ng-template #empty>
      <ion-row class="ion-margin ion-justify-content-center" *ngIf="!isLoading">
        <ion-text>{{ 'EVENTS.NO_DATA' | translate }}</ion-text>
      </ion-row>
    </ng-template>
  </ng-container>
</ion-content>
