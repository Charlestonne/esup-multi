<app-header [backRouterLink]="urlBeforeEvents"></app-header>
<ion-content>
  <ion-progress-bar *ngIf="isLoading" type="indeterminate"></ion-progress-bar>

  <ng-container *ngIf="events$ | async as events">
    <ng-container *ngIf="events.length > 0; else empty">
      <app-event-card
        *ngFor="let event of events"
        [event]="event"
      ></app-event-card>
    </ng-container>
    <ng-template #empty>
      <ion-row class="ion-margin ion-justify-content-center" *ngIf="!isLoading">
        <ion-text>{{ 'EVENTS.NO_DATA' | translate }}</ion-text>
      </ion-row>
    </ng-template>
  </ng-container>
</ion-content>

<!-- Footer with two tabs -->
<ion-footer class="events-footer">
  <ion-toolbar class="events-toolbar">
    <ion-segment [value]="activeTab$ | async" (ionChange)="onSegmentChange($event)" class="events-segment">
      <ion-segment-button value="feed" layout="icon-bottom" class="events-segment-button">
        <ion-icon name="list-outline" size="large"></ion-icon>
        <ion-label>{{ 'EVENTS.FEED' | translate }}</ion-label>
      </ion-segment-button>
      <ion-segment-button value="calendar" layout="icon-bottom" class="events-segment-button">
        <ion-icon name="calendar-outline" size="large"></ion-icon>
        <ion-label>{{ 'EVENTS.CALENDAR' | translate }}</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-footer>
