<app-header [backRouterLink]="urlBeforeEvents"></app-header>
<ion-content>
  <ion-progress-bar *ngIf="isLoading" type="indeterminate"></ion-progress-bar>

  <ng-container *ngIf="filter$ | async as filter">
    <div class="events-controls-row">
      <ion-button fill="outline" (click)="openSortModal()">
        <ion-icon slot="start" [name]="filter.sortOrder === 'asc' ? 'arrow-up-outline' : 'arrow-down-outline'"></ion-icon>
        {{ 'EVENTS.SORT.OPEN' | translate }}
      </ion-button>

      <ion-button fill="outline" (click)="openFilterModal()">
        <ion-icon slot="start" name="filter-outline"></ion-icon>
        {{ 'EVENTS.FILTERS.OPEN' | translate }}
      </ion-button>
    </div>

    <div
      class="events-active-chips"
      *ngIf="filter.period !== 'all' || filter.associations.length > 0 || filter.types.length > 0 || filter.from || filter.to"
    >
      <ion-chip
        *ngIf="filter.period !== 'all'"
        color="tertiary"
        outline="true"
        (click)="resetPeriod()"
      >
        <ion-label>{{ 'EVENTS.FILTERS.PERIOD.' + (filter.period | uppercase) | translate }}</ion-label>
        <ion-icon name="close-circle"></ion-icon>
      </ion-chip>
      <ion-chip
        *ngFor="let asso of filter.associations"
        color="primary"
        outline="true"
        (click)="removeAssociation(asso)"
      >
        <ion-label>{{ asso }}</ion-label>
        <ion-icon name="close-circle"></ion-icon>
      </ion-chip>
      <ion-chip
        *ngFor="let type of filter.types"
        color="secondary"
        outline="true"
        (click)="removeType(type)"
      >
        <ion-label>{{ type }}</ion-label>
        <ion-icon name="close-circle"></ion-icon>
      </ion-chip>
      <ion-chip
        *ngIf="filter.from || filter.to"
        color="medium"
        outline="true"
        (click)="resetDateRange()"
      >
        <ion-label>{{ filter.from || '…' }} → {{ filter.to || '…' }}</ion-label>
        <ion-icon name="close-circle"></ion-icon>
      </ion-chip>
    </div>
  </ng-container>

  <ng-container *ngIf="events$ | async as events">
    <div class="events-list-container" *ngIf="events.length > 0; else empty">
      <app-event-card
        *ngFor="let event of events"
        [event]="event"
      ></app-event-card>
    </div>
    <ng-template #empty>
      <ion-row class="ion-margin ion-justify-content-center" *ngIf="!isLoading">
        <ion-text>{{ 'EVENTS.NO_DATA' | translate }}</ion-text>
      </ion-row>
    </ng-template>
  </ng-container>

  <ion-modal
    class="events-sheet-modal"
    [isOpen]="isFilterOpen"
    (didDismiss)="closeFilterModal()"
    [breakpoints]="[0, 0.8, 1]"
    [initialBreakpoint]="0.8"
    [handle]="true"
  >
    <ng-template>
      <app-events-filter-modal
        [availableAssociations]="availableAssociations"
        [availableTypes]="availableTypes"
        [currentFilter]="(filter$ | async) || defaultFilter"
        (apply)="onFilterApply($event)"
        (reset)="onFilterReset()"
        (dismiss)="closeFilterModal()"
      ></app-events-filter-modal>
    </ng-template>
  </ion-modal>

  <ion-modal
    class="events-sheet-modal"
    [isOpen]="isSortOpen"
    (didDismiss)="closeSortModal()"
    [breakpoints]="[0, 0.4]"
    [initialBreakpoint]="0.4"
    [handle]="true"
  >
    <ng-template>
      <app-events-sort-modal
        [currentSort]="((filter$ | async)?.sortOrder) || 'asc'"
        (apply)="onSortApply($event)"
        (dismiss)="closeSortModal()"
      ></app-events-sort-modal>
    </ng-template>
  </ion-modal>
</ion-content>

<ion-footer class="events-footer" mode="ios">
  <ion-toolbar class="events-toolbar">
    <ion-segment [value]="activeTab$ | async" (ionChange)="onSegmentChange($event)" class="events-segment" mode="ios">
      <ion-segment-button value="feed" layout="icon-top" class="events-segment-button">
        <ion-icon name="list-outline"></ion-icon>
      </ion-segment-button>
      <ion-segment-button value="calendar" layout="icon-top" class="events-segment-button">
        <ion-icon name="calendar-outline"></ion-icon>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-footer>
