<ion-card>
  <ion-img *ngIf="event.imageUrl" [src]="event.imageUrl"></ion-img>
  <ion-card-header>
    <ion-chip *ngIf="event.association" color="primary" outline="true">
      <ion-label>{{ event.association }}</ion-label>
    </ion-chip>
    <ion-chip *ngIf="event.type" color="secondary" outline="true">
      <ion-label>{{ event.type }}</ion-label>
    </ion-chip>
    <ion-card-title class="app-title-6">{{ event.title }}</ion-card-title>
    <ion-card-subtitle>
      <ion-icon name="calendar-outline"></ion-icon>
      {{ event.startDate | date:'dd/MM/yyyy HH:mm' }}
    </ion-card-subtitle>
  </ion-card-header>
  <ion-card-content>
    <ion-icon name="location-outline"></ion-icon>
    <span class="app-text-4">{{ event.location }}</span>
  </ion-card-content>
</ion-card>
